apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def releaseStoreFile = providers.gradleProperty("releaseStoreFile")
def releaseStorePassword = providers.gradleProperty("releaseStorePassword")
def releaseKeyAlias = providers.gradleProperty("releaseKeyAlias")
def releaseKeyPassword = providers.gradleProperty("releaseKeyPassword")
def hasReleaseSigning = releaseStoreFile.isPresent() &&
        releaseStorePassword.isPresent() && releaseKeyAlias.isPresent() && releaseKeyPassword.isPresent()

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "app.sakinalauncher"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 113
        versionName "v6.6.4"

        resourceConfigurations += ["en", "in", "ar"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile.get())
                storePassword releaseStorePassword.get()
                keyAlias releaseKeyAlias.get()
                keyPassword releaseKeyPassword.get()
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            // Local builds remain installable; CI releases override this with a stable secret key.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    lint {
        // New Sakina-specific feature strings (prayer times, dzikir, muslim center)
        // are intentionally shipped untranslated; missing community translations are
        // not code defects and should not break the build.
        disable 'MissingTranslation'
    }
    namespace 'app.sakinalauncher'

    testOptions {
        unitTests {
            // Robolectric needs the merged resources/themes to inflate real layouts.
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview
    implementation libs.okhttp
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit
    testImplementation libs.json
    testImplementation libs.robolectric
}
