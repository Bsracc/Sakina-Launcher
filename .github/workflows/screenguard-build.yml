name: Screen Guard APK

on:
  push:
    branches:
      - screen-guard-apk-prototype
    paths:
      - "screen-guard/**"
      - ".github/workflows/screenguard-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Screen Guard debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download quantized gender model
        working-directory: screen-guard/app/src/main
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/shubham0204/Age-Gender_Estimation_TF-Android/master/app/src/main/assets/model_lite_gender_q.tflite \
            --output assets/model_lite_gender_q.tflite
          test -s assets/model_lite_gender_q.tflite
          ls -lh assets/model_lite_gender_q.tflite

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew -p screen-guard :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Screen-Guard-debug-APK
          path: screen-guard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
